name: spring-petclinic-rest
description: REST-only Spring PetClinic (no templates, pure API)
type: spring-boot
skill: migrate-spring-to-quarkus
source: https://github.com/spring-petclinic/spring-petclinic-rest
ref: master
timeout: 900

checks:
  builds:
  tests-pass:
  no-spring-deps:
  has-quarkus:
  smoke-test:
    endpoints:
      - path: /api/owners
        method: GET
        expected_status: 200
      - path: /api/vets
        method: GET
        expected_status: 200
      - path: /api/pettypes
        method: GET
        expected_status: 200