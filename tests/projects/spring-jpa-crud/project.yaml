name: spring-jpa-crud
description: Spring Boot JPA CRUD app with H2, Spring Data, validation
type: spring-boot
skill: migrate-spring-to-quarkus
source: local
timeout: 600

checks:
  - builds
  - tests-pass
  - no-spring-deps
  - has-quarkus
  - starts-up
  - smoke-test

endpoints:
  - path: /api/todos
    method: GET
    expected_status: 200
  - path: /api/todos
    method: POST
    body: '{"title":"Smoke test todo","completed":false}'
    expected_status: 201
    body_contains: '"title"'
