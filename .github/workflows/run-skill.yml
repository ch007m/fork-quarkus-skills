name: Execute AI SKILL using IBM Bob

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '21'

jobs:
  run-bob:
    name: Run ACP Agent with Skill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install ACP client and IBM Bob agent
        uses: ./.github/actions/acp-agent-action
        with:
          bobshell_api_key: ${{ secrets.BOBSHELL_API_KEY }}

      - name: Execute SKILL
        shell: bash
        env:
          PROJECT_NAME: dummy
        run: |
          set -euo pipefail

          cd tests
          mvn clean test -Pintegration \
            -Dai.cmd=ibm-bob \
            -Dai.prompt="Say Hello" \
            -Dai.projects=${PROJECT_NAME} \
            -Dai.skills=../tests/skills/${PROJECT_NAME} \
            -Dai.review=false

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-reports-${{ github.run_id }}
          path: tests/target/runs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AI workdir outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workdir-outputs-${{ github.run_id }}
          path: tests/target/workdirs/
          if-no-files-found: warn
          retention-days: 30
