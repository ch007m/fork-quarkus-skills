name: PR Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  collect:
    name: Collect PR metadata
    runs-on: ubuntu-latest
    steps:
      - name: Save PR metadata
        run: |
          mkdir -p /tmp/pr-meta
          echo "${{ github.event.pull_request.number }}" > /tmp/pr-meta/pr_number
          echo "${{ github.event.pull_request.head.sha }}" > /tmp/pr-meta/head_sha

      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-meta
          path: /tmp/pr-meta/
          retention-days: 1